<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Administration CENA</title>
<style>
:root{--m:#5b3a29;--m2:#7a5238;--c:#f6f1ec;--b:#e2d6cb;--t:#2b1f18;--e:#b3261e}
*{box-sizing:border-box}
body{margin:0;font:17px/1.5 system-ui,sans-serif;color:var(--t);background:var(--c)}
header{background:var(--m);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5}
.logo{width:48px;height:48px;border-radius:50%;background:#fff;color:var(--m);display:grid;place-items:center;font-weight:800;font-size:14px;flex:none}
header b{display:block;font-size:16px}header small{opacity:.8;font-size:13px}
main{max-width:720px;margin:0 auto;padding:16px}
.card{background:#fff;border:1px solid var(--b);border-radius:14px;padding:16px;margin:0 0 14px}
h1{font-size:22px;margin:.2em 0}h2{font-size:18px;margin:14px 0 6px;color:var(--m)}
.btn{display:block;width:100%;min-height:50px;border:0;border-radius:12px;background:var(--m);color:#fff;font-weight:600;font-size:16px;font-family:inherit;padding:12px;margin:8px 0;cursor:pointer;text-align:center}
.btn.alt{background:#fff;color:var(--m);border:2px solid var(--m)}
label{display:block;font-weight:600;margin:12px 0 4px;font-size:15px}
.chk{display:flex;align-items:center;gap:10px;font-weight:400;margin:6px 0}
.chk input{width:24px;min-height:24px}
input,select,textarea{width:100%;min-height:50px;font:inherit;padding:10px;border:1.5px solid var(--b);border-radius:10px;background:#fff}
.err{color:var(--e);font-size:14px}
.row{display:flex;gap:10px}.row .btn{flex:1}
.f{font-size:15px;margin-top:4px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto}
.tabs button{flex:1;min-height:44px;border:1.5px solid var(--m);background:#fff;color:var(--m);border-radius:10px;font-weight:600;font-family:inherit;white-space:nowrap;padding:0 12px}
.hide{display:none!important}
#fiche{display:none}
@media print{body{background:#fff}header,main>*:not(#fiche){display:none!important}#fiche{display:block}}
</style></head><body>
<header><div class="logo">CENA</div><div><b>Administration CENA</b><small id="who">Espace privé</small></div></header>
<main>
<section id="login" class="card"><h1>Connexion</h1>
 <label for="em">Adresse e-mail</label><input id="em" type="email" autocomplete="username">
 <label for="pw">Mot de passe</label><input id="pw" type="password" autocomplete="current-password">
 <div class="err" id="lerr"></div>
 <button class="btn" onclick="login()">Se connecter</button></section>

<div id="app" class="hide">
 <div class="tabs"><button onclick="tab('dash')">Tableau</button><button onclick="tab('list')">Dossiers</button><button onclick="tab('set')">Paramètres</button><button onclick="out()">Quitter</button></div>
 <section id="dash"></section>
 <section id="list" class="hide">
  <input id="q" placeholder="Rechercher : nom, numéro, NISU" oninput="flt()">
  <select id="fc" onchange="flt()"></select><select id="fs" onchange="flt()"></select><select id="fp" onchange="flt()"></select>
  <label for="fd">Inscrits à partir du</label><input id="fd" type="date" onchange="flt()">
  <div id="lres" style="margin-top:12px"></div></section>
 <section id="det" class="hide"></section>
 <section id="set" class="hide"></section>
</div>
<div id="fiche"></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const sb=supabase.createClient("https://msnvfuhbpsnfsirvevsu.supabase.co","sb_publishable_EOI4d_T8nyrKNqu1wceLcg_uRTM5VWE");
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const rows=o=>Object.entries(o).filter(e=>e[1]).map(([k,x])=>`<div class="f"><b>${k}</b> : ${esc(x)}</div>`).join("");
const one=x=>Array.isArray(x)?x[0]:x;
const fmt=n=>Number(n).toLocaleString("fr-FR")+" HTG";
const CL=[];for(let i=1;i<=9;i++)CL.push([i==1?"1ere_fond":i+"eme_fond",(i==1?"1ère":i+"ème")+" année fondamentale"]);
for(let i=1;i<=4;i++)CL.push(["NS"+i,"NS"+i]);
const CLN=Object.fromEntries(CL);
const SL={inscription_recue:"Inscription reçue",en_attente_verification:"En attente de vérification",documents_incomplets:"Documents incomplets",paiement_en_attente:"Paiement en attente",paiement_a_verifier:"Paiement à vérifier",en_traitement:"Dossier en cours de traitement",valide:"Dossier validé",rejete:"Dossier rejeté"};
const PL={en_attente:"En attente de vérification",confirme:"Paiement confirmé",refuse:"Paiement refusé"};
const DOCL={acte_naissance:"Acte de naissance",cin_responsable:"Carte d'identité du responsable",carnet:"Carnet du dernier établissement",photo:"Photo récente",preuve_paiement:"Preuve de paiement",fiche_9eme:"Fiche de 9ème année",releve_notes:"Relevé de notes"};
let LIST=[],CFG=null,D=null;

async function login(){$("lerr").textContent="";
 const{error}=await sb.auth.signInWithPassword({email:$("em").value.trim(),password:$("pw").value});
 if(error)return $("lerr").textContent="Connexion refusée. Vérifiez l'e-mail et le mot de passe.";
 start()}
async function start(){const{data:{session}}=await sb.auth.getSession();if(!session)return;
 const{data:a}=await sb.from("admins").select("user_id").maybeSingle();
 if(!a){await sb.auth.signOut();$("lerr").textContent="Ce compte n'a pas accès à l'administration.";return}
 $("login").classList.add("hide");$("app").classList.remove("hide");$("who").textContent=session.user.email;
 $("fc").innerHTML='<option value="">Toutes les classes</option>'+CL.map(x=>`<option value="${x[0]}">${x[1]}</option>`).join("");
 $("fs").innerHTML='<option value="">Tous les statuts</option>'+Object.entries(SL).map(x=>`<option value="${x[0]}">${x[1]}</option>`).join("");
 $("fp").innerHTML='<option value="">Tous les paiements</option>'+Object.entries(PL).map(x=>`<option value="${x[0]}">${x[1]}</option>`).join("");
 await load();tab("dash")}
async function out(){await sb.auth.signOut();location.reload()}
async function load(){const{data,error}=await sb.from("inscriptions").select("id,numero,nom,prenom,classe,statut,cree_le,nisu,paiements(statut)").order("cree_le",{ascending:false}).limit(2000);
 if(error){alert("Erreur de chargement : "+error.message);return}
 LIST=(data||[]).map(r=>({...r,pay:(one(r.paiements)||{}).statut}))}
function tab(n){["dash","list","det","set"].forEach(x=>$(x).classList.toggle("hide",x!=n));scrollTo(0,0);
 if(n=="dash")dash();if(n=="list")flt();if(n=="set")sets()}

function dash(){const now=new Date(),d0=new Date(now.getFullYear(),now.getMonth(),now.getDate()),wk=new Date(d0);wk.setDate(d0.getDate()-((d0.getDay()+6)%7));
 const c=f=>LIST.filter(f).length,t=x=>new Date(x.cree_le),by={};LIST.forEach(x=>by[x.classe]=(by[x.classe]||0)+1);
 const box=(n,l)=>`<div class="card" style="text-align:center;margin:0"><div style="font-size:28px;font-weight:800;color:var(--m)">${n}</div><div class="f">${l}</div></div>`;
 $("dash").innerHTML=`<div class="grid">`+box(LIST.length,"Total des inscriptions")+box(c(x=>t(x)>=d0),"Aujourd'hui")+box(c(x=>t(x)>=wk),"Cette semaine")
 +box(c(x=>x.pay=="en_attente"),"Paiements en attente")+box(c(x=>x.pay=="confirme"),"Paiements confirmés")+box(c(x=>x.statut=="documents_incomplets"),"Dossiers incomplets")+box(c(x=>x.statut=="valide"),"Dossiers validés")+box(c(x=>x.statut=="rejete"),"Dossiers refusés")
 +`</div><div class="card" style="margin-top:12px"><h2 style="margin-top:0">Inscriptions par classe</h2>`+CL.map(([k,l])=>`<div class="f">${l} : <b>${by[k]||0}</b></div>`).join("")+`</div>`}

function flt(){const q=$("q").value.trim().toLowerCase(),c=$("fc").value,s=$("fs").value,p=$("fp").value,d=$("fd").value;
 const r=LIST.filter(x=>(!q||[x.numero,x.nom,x.prenom,x.nisu].join(" ").toLowerCase().includes(q))&&(!c||x.classe==c)&&(!s||x.statut==s)&&(!p||x.pay==p)&&(!d||x.cree_le.slice(0,10)>=d));
 $("lres").innerHTML=`<div class="f">${r.length} dossier(s)</div>`+r.slice(0,200).map(x=>`<div class="card" onclick="ouvrir('${x.id}')" style="cursor:pointer;margin-top:8px"><b>${esc(x.prenom)} ${esc(x.nom)}</b><div class="f">${x.numero} · ${CLN[x.classe]}</div><div class="f">${SL[x.statut]} · Paiement : ${PL[x.pay]||"-"}</div><div class="f">${new Date(x.cree_le).toLocaleDateString("fr-FR")}</div></div>`).join("")}

const eleveRows=()=>rows({Classe:CLN[D.classe],"Date de naissance":D.date_naissance,"Lieu de naissance":D.lieu_naissance,Sexe:D.sexe=="M"?"Masculin":"Féminin",NISU:D.nisu,"Numéro d'ordre":D.numero_ordre});
const parRows=g=>{const x=(D.parents||[]).find(y=>y.role==g);return x?rows({Nom:`${x.prenom||""} ${x.nom||""}`.trim(),Statut:x.vivant?"Vivant(e)":"Décédé(e)",Profession:x.profession,Téléphone:x.telephone,Résidence:[x.residence,x.zone,x.departement].filter(Boolean).join(", ")}):'<div class="f">Non renseigné</div>'};
const resRows=()=>{const r=one(D.responsables)||{};return rows({Nom:`${r.prenom||""} ${r.nom||""}`.trim(),Profession:r.profession,CIN:r.cin,Téléphone:r.telephone,Résidence:[r.residence,r.zone,r.departement].filter(Boolean).join(", ")})};

async function ouvrir(id){tab("det");$("det").textContent="Chargement…";
 const{data,error}=await sb.from("inscriptions").select("*,parents(*),responsables(*),paiements(*),documents(*),remarques(*)").eq("id",id).single();
 if(error)return $("det").innerHTML=`<p class="err">${esc(error.message)}</p>`;
 D=data;render()}
function render(){const r=D,p=one(r.paiements)||{};
 const ds=(r.documents||[]).map((d,i)=>`<div class="card" style="margin:8px 0;padding:12px"><b>${DOCL[d.type]||d.type}</b> ${d.verifie?"✔ vérifié":""} ${d.manquant_signale?"⚠ à refaire":""}<div class="f">${esc(d.nom_original)} · ${(d.taille_octets/1048576).toFixed(2)} Mo</div>
  <div class="row"><button class="btn alt" onclick="dopen(${i},0)">Ouvrir</button><button class="btn alt" onclick="dopen(${i},1)">Télécharger</button></div>
  <div class="row"><button class="btn alt" onclick="dflag('${d.id}','verifie',${!d.verifie})">${d.verifie?"Retirer « vérifié »":"Marquer vérifié"}</button><button class="btn alt" onclick="dflag('${d.id}','manquant_signale',${!d.manquant_signale})">${d.manquant_signale?"Retirer le signalement":"Signaler à refaire"}</button></div></div>`).join("");
 const rem=(r.remarques||[]).slice().sort((a,b)=>b.cree_le.localeCompare(a.cree_le)).map(x=>`<div class="f">• ${esc(x.texte)} <i>(${new Date(x.cree_le).toLocaleDateString("fr-FR")})</i></div>`).join("");
 $("det").innerHTML=`<button class="btn alt" onclick="tab('list')">← Retour aux dossiers</button>
 <div class="card"><h1>${esc(r.prenom)} ${esc(r.nom)}</h1><div class="f"><b>${r.numero}</b> · ${new Date(r.cree_le).toLocaleString("fr-FR")}</div>
 <h2>Élève</h2>${eleveRows()}<h2>Père</h2>${parRows("pere")}<h2>Mère</h2>${parRows("mere")}<h2>Responsable</h2>${resRows()}</div>
 <div class="card"><h2 style="margin-top:0">Documents</h2>${ds||'<div class="f">Aucun document.</div>'}</div>
 <div class="card"><h2 style="margin-top:0">Paiement</h2>${rows({Montant:p.montant_htg?fmt(p.montant_htg):"",Méthode:p.methode,Référence:p.reference_transaction,Date:p.date_paiement,Statut:PL[p.statut]})}
  <div class="row"><button class="btn" onclick="setPay('confirme')">Confirmer</button><button class="btn alt" onclick="setPay('refuse')">Refuser</button></div>
  <button class="btn alt" onclick="setPay('en_attente')">Remettre en attente</button></div>
 <div class="card"><h2 style="margin-top:0">Décision sur le dossier</h2><div class="f" style="margin-bottom:6px">Statut actuel : <b>${SL[r.statut]}</b></div>
  <div class="row"><button class="btn" onclick="decide('valide')">✔ Accepter</button><button class="btn alt" onclick="decide('rejete')">✖ Refuser</button></div>
  <button class="btn alt" onclick="decide('documents_incomplets')">⚠ Dossier incomplet</button><label>Autre statut</label><select id="st">${Object.entries(SL).map(([k,v])=>`<option value="${k}"${k==r.statut?" selected":""}>${v}</option>`).join("")}</select>
  <button class="btn" onclick="setSt($('st').value)">Enregistrer le statut</button></div>
 <div class="card"><h2 style="margin-top:0">Remarques</h2>${rem}<textarea id="rt" rows="3" placeholder="Ajouter une remarque" style="margin-top:8px"></textarea><button class="btn alt" onclick="addr()">Ajouter la remarque</button></div>
 <button class="btn" onclick="imprimer()">Imprimer la fiche</button>`}

async function upd(table,match,vals){const{error}=await sb.from(table).update(vals).match(match);if(error){alert("Erreur : "+error.message);return false}return true}
async function setPay(s){const u=(await sb.auth.getUser()).data.user;
 if(await upd("paiements",{inscription_id:D.id},{statut:s,verifie_le:new Date().toISOString(),verifie_par:u.id})){await load();ouvrir(D.id)}}
async function setSt(v){if(await upd("inscriptions",{id:D.id},{statut:v})){await load();ouvrir(D.id)}}
async function decide(s){const l={valide:"accepter ce dossier",rejete:"refuser ce dossier",documents_incomplets:"marquer ce dossier comme incomplet"}[s];
 const m=prompt("Vous allez "+l+".\nMotif ou remarque (facultatif) :","");if(m===null)return;
 if(!(await upd("inscriptions",{id:D.id},{statut:s})))return;
 if(m.trim()){const u=(await sb.auth.getUser()).data.user;await sb.from("remarques").insert({inscription_id:D.id,texte:SL[s]+" — "+m.trim(),auteur:u.id})}
 await load();ouvrir(D.id)}
async function dflag(id,f,v){if(await upd("documents",{id},{[f]:v}))ouvrir(D.id)}
async function dopen(i,dl){const d=D.documents[i];
 const{data,error}=await sb.storage.from("dossiers").createSignedUrl(d.chemin,300,dl?{download:true}:undefined);
 if(error)return alert("Erreur : "+error.message);window.open(data.signedUrl,"_blank")}
async function addr(){const t=$("rt").value.trim();if(!t)return;const u=(await sb.auth.getUser()).data.user;
 const{error}=await sb.from("remarques").insert({inscription_id:D.id,texte:t,auteur:u.id});if(error)return alert("Erreur : "+error.message);ouvrir(D.id)}

function imprimer(){const p=one(D.paiements)||{};
 $("fiche").innerHTML=`<div style="text-align:center"><div class="logo" style="margin:auto;border:3px solid #5b3a29">CENA</div><h1>Collège Évangélique Le Normalien de L'Arcahaie</h1><h2>Fiche d'inscription</h2></div>`
 +rows({"Numéro d'inscription":D.numero,Date:new Date(D.cree_le).toLocaleDateString("fr-FR"),Nom:D.nom,Prénom:D.prenom})
 +`<h2>Élève</h2>${eleveRows()}<h2>Père</h2>${parRows("pere")}<h2>Mère</h2>${parRows("mere")}<h2>Responsable</h2>${resRows()}<h2>Documents reçus</h2>`
 +(D.documents||[]).map(d=>`<div class="f">✔ ${DOCL[d.type]||d.type}</div>`).join("")
 +`<h2>Paiement</h2>`+rows({"Montant payé":fmt(p.montant_htg||0),"Statut du paiement":PL[p.statut]})
 +`<div style="display:flex;gap:20px;margin-top:30px"><div style="flex:1;border:1px solid #000;height:120px;padding:6px">Cachet de l'école</div><div style="flex:1;border:1px solid #000;height:120px;padding:6px">Signature</div></div>`;
 window.print()}

async function sets(){$("set").textContent="Chargement…";
 const{data,error}=await sb.from("parametres").select("config").eq("id",1).single();
 if(error)return $("set").innerHTML=`<p class="err">${esc(error.message)}</p>`;
 CFG=data.config;const dk=CFG.documents||{};
 $("set").innerHTML=`<div class="card"><h2 style="margin-top:0">Frais et paiement</h2>
 <label>Frais d'inscription (HTG)</label><input id="s_f" type="number" min="1" value="${CFG.frais_htg}">
 <label>Modes de paiement (un par ligne)</label><textarea id="s_m" rows="4">${esc((CFG.methodes_paiement||[]).join("\n"))}</textarea>
 <label>Instructions de paiement (ex. numéro MonCash)</label><textarea id="s_p" rows="3">${esc(CFG.paiement_instructions||"")}</textarea></div>
 <div class="card"><h2 style="margin-top:0">Textes de l'accueil</h2>
 <label>Présentation</label><textarea id="s_i" rows="3">${esc(CFG.accueil_intro||"")}</textarea>
 <label>Annonce importante (laisser vide pour ne rien afficher)</label><textarea id="s_a" rows="3">${esc(CFG.annonce||"")}</textarea>
 <label>Note sous les frais</label><textarea id="s_n" rows="2">${esc(CFG.frais_note||"")}</textarea></div>
 <div class="card"><h2 style="margin-top:0">Documents demandés</h2>`
 +Object.keys(DOCL).map(k=>{const d=dk[k]||{label:DOCL[k],requis:true,actif:true};return `<label>${DOCL[k]}</label><input id="dl_${k}" value="${esc(d.label)}"><label class="chk"><input type="checkbox" id="da_${k}"${d.actif?" checked":""}> Demandé</label><label class="chk"><input type="checkbox" id="dr_${k}"${d.requis?" checked":""}> Obligatoire</label>`}).join("")
 +`<div class="f">La fiche de 9ème année ne concerne que NS1 à NS4, et le relevé de notes que NS2 à NS4.</div></div>
 <button class="btn" onclick="saveSet()">Enregistrer les paramètres</button><div id="smsg"></div>`}
async function saveSet(){const f=parseInt($("s_f").value,10),m=$("s_m").value.split("\n").map(x=>x.trim()).filter(Boolean);
 if(!(f>0))return alert("Montant invalide.");if(!m.length)return alert("Ajoutez au moins un mode de paiement.");
 const docs={};Object.keys(DOCL).forEach(k=>docs[k]={label:$("dl_"+k).value.trim()||DOCL[k],actif:$("da_"+k).checked,requis:$("dr_"+k).checked});
 const cfg={...CFG,frais_htg:f,methodes_paiement:m,paiement_instructions:$("s_p").value.trim(),accueil_intro:$("s_i").value.trim(),annonce:$("s_a").value.trim(),frais_note:$("s_n").value.trim(),documents:docs};
 const{error}=await sb.from("parametres").update({config:cfg,maj_le:new Date().toISOString()}).eq("id",1);
 if(error)return $("smsg").innerHTML=`<p class="err">${esc(error.message)}</p>`;
 CFG=cfg;$("smsg").innerHTML='<p style="color:#1b6e2d">✔ Enregistré. Le site public sera à jour en moins d\'une minute.</p>'}

start();
</script></body></html>
